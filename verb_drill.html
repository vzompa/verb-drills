<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verb Tense Drill</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,sans-serif;background:#f5f4f0;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px}
  .app{width:100%;max-width:600px}
  h1{font-size:20px;font-weight:600;color:#1a1a18;margin-bottom:4px;text-align:center}
  .sub{font-size:13px;color:#888;text-align:center;margin-bottom:20px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .fbtn{padding:7px 15px;font-size:13px;border-radius:8px;border:1px solid #d4d3cb;background:#fff;color:#555;cursor:pointer;transition:all .15s}
  .fbtn.active{background:#1a1a18;color:#fff;border-color:#1a1a18}
  .fbtn:hover:not(.active){background:#eeeee8}
  .scorebar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .bar{flex:1;height:6px;background:#e0dfd8;border-radius:99px;overflow:hidden}
  .barfill{height:100%;background:#1D9E75;border-radius:99px;transition:width .35s}
  .scoretxt{font-size:13px;color:#888;white-space:nowrap}
  .card{background:#fff;border:1px solid #e4e3db;border-radius:14px;padding:20px 24px;margin-bottom:12px}
  .cardtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:6px;font-weight:500}
  .badge-present{background:#E1F5EE;color:#0F6E56}
  .badge-past{background:#E6F1FB;color:#185FA5}
  .badge-future{background:#EEEDFE;color:#534AB7}
  .counter{font-size:12px;color:#aaa}
  .sentence{font-size:22px;line-height:2.2;color:#1a1a18;margin-bottom:6px;word-break:break-word}
  .blank{display:inline-block;min-width:120px;border-bottom:2.5px solid #ccc;padding:0 6px;text-align:center;font-style:italic;color:#aaa;vertical-align:bottom;transition:all .2s}
  .blank.correct{border-color:#1D9E75;color:#0F6E56}
  .blank.wrong{border-color:#E24B4A;color:#A32D2D}
  .hint{font-size:13px;color:#aaa;margin-top:2px}
  .feedback{font-size:14px;padding:10px 14px;border-radius:8px;margin-top:12px;line-height:1.5}
  .feedback.correct{background:#E1F5EE;color:#0F6E56}
  .feedback.wrong{background:#FCEBEB;color:#A32D2D}
  .inputrow{display:flex;gap:8px;margin-bottom:8px}
  .inputrow input{flex:1;font-size:16px;padding:11px 14px;border:1px solid #d4d3cb;border-radius:10px;background:#fff;color:#1a1a18;outline:none;transition:border .15s}
  .inputrow input:focus{border-color:#888}
  .inputrow input:disabled{background:#f5f4f0;color:#aaa}
  .chkbtn{padding:11px 22px;font-size:15px;font-weight:500;border-radius:10px;border:1px solid #d4d3cb;background:#1a1a18;color:#fff;cursor:pointer;transition:all .15s;white-space:nowrap}
  .chkbtn:hover{background:#333}
  .chkbtn:disabled{background:#ccc;border-color:#ccc;cursor:default}
  .secondrow{display:flex;gap:8px;min-height:36px;align-items:center}
  .sbtn{padding:7px 14px;font-size:13px;border-radius:8px;border:1px solid #d4d3cb;background:#fff;color:#555;cursor:pointer}
  .sbtn:hover{background:#eeeee8}
  @media(max-width:420px){
    .sentence{font-size:18px}
    .chkbtn{padding:11px 14px;font-size:14px}
    h1{font-size:18px}
  }
</style>
</head>
<body>
<div class="app">
  <h1>Verb Tense Drill</h1>
  <p class="sub">Type the correct verb form. Press Enter to check.</p>
  <div id="root"></div>
</div>
<script>
const Q=[
  {s:["Every day, I"," to school."],h:"walk",a:["walk"],t:"present",n:"I / you / we / they + base verb (no -s)"},
  {s:["She"," her bike to work every day."],h:"ride",a:["rides"],t:"present",n:"he / she / it → verb + s  (ride → rides)"},
  {s:["He"," coffee."],h:"not / like",a:["doesn't like","does not like"],t:"present",n:"he/she/it → doesn't + base verb"},
  {s:[""," at the library?"],h:"you / study",a:["do you study"],t:"present",n:"Do + I/you/we/they + base verb?"},
  {s:["Whales"," air."],h:"breathe",a:["breathe"],t:"present",n:"plural subject + base verb (no -s)"},
  {s:[""," a fish?"],h:"a whale / be",a:["is a whale"],t:"present",n:"Is + he/she/it + ...?"},
  {s:["He"," a bicycle."],h:"have",a:["has"],t:"present",n:"he/she/it → has  (not have!)"},
  {s:["They"," meat."],h:"not / eat",a:["don't eat","do not eat"],t:"present",n:"I/you/we/they → don't + base verb"},
  {s:["Where","?"],h:"she / work",a:["does she work"],t:"present",n:"Does + he/she/it + base verb?"},
  {s:["He"," English every night."],h:"study",a:["studies"],t:"present",n:"he/she/it → studies  (y → ies)"},
  {s:["I"," to the library to study."],h:"not / go",a:["don't go","do not go"],t:"present",n:"I/you/we/they → don't + base verb"},
  {s:[""," a car?"],h:"she / have",a:["does she have"],t:"present",n:"Does + he/she/it + base verb?"},
  {s:["Yesterday, I"," to school."],h:"walk",a:["walked"],t:"past",n:"regular verb → add -ed"},
  {s:["She"," her bike yesterday."],h:"ride",a:["rode"],t:"past",n:"irregular: ride → rode"},
  {s:[""," me last night?"],h:"you / call",a:["did you call"],t:"past",n:"Did + subject + base verb?"},
  {s:["No, I"," you."],h:"not / call",a:["didn't call","did not call"],t:"past",n:"didn't + base verb  (not 'called'!)"},
  {s:["We"," for a few minutes."],h:"talk",a:["talked"],t:"past",n:"regular verb → add -ed"},
  {s:["A dog"," in front of his bicycle."],h:"run",a:["ran"],t:"past",n:"irregular: run → ran"},
  {s:["He"," to avoid the dog."],h:"try",a:["tried"],t:"past",n:"try → tried  (y → ied)"},
  {s:["She"," anything about him."],h:"not / say",a:["didn't say","did not say"],t:"past",n:"didn't + base verb  (not 'said'!)"},
  {s:["Tom"," in an accident yesterday."],h:"be",a:["was"],t:"past",n:"he/she/it → was"},
  {s:[""," you about Tom?"],h:"she / tell",a:["did she tell"],t:"past",n:"Did + subject + base verb?"},
  {s:["They"," in class yesterday."],h:"not / be",a:["weren't","were not"],t:"past",n:"they/we/you → weren't"},
  {s:["He"," to hit the dog."],h:"not / want",a:["didn't want","did not want"],t:"past",n:"didn't + base verb  (not 'wanted'!)"},
  {s:["I"," in class tomorrow."],h:"be",a:["will be"],t:"future",n:"will + base verb"},
  {s:["She"," to class tomorrow."],h:"not / come",a:["won't come","will not come"],t:"future",n:"won't + base verb"},
  {s:[""," at home tonight?"],h:"you / be",a:["will you be"],t:"future",n:"Will + subject + base verb?"},
  {s:["He"," hard next week."],h:"study",a:["will study"],t:"future",n:"will + base verb"},
  {s:["They"," here next Monday."],h:"not / be",a:["won't be","will not be"],t:"future",n:"won't + base verb"},
  {s:[""," you tomorrow?"],h:"she / call",a:["will she call"],t:"future",n:"Will + subject + base verb?"},
];

function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

let filter="all",deck=shuffle(Q),idx=0,correct=0,total=0,status=null,showAns=false,inputVal="";

function fd(){return filter==="all"?deck:deck.filter(q=>q.t===filter)}
function cur(){let f=fd();return f[idx%f.length]}

function render(){
  const q=cur();const f=fd();
  const pct=total>0?Math.round(correct/total*100):0;
  const tLabel={present:"Simple present",past:"Simple past",future:"Future (will)"};
  let blankTxt=inputVal||"\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0";
  let blankCls="blank";
  if(status==="correct"){blankTxt=q.a[0];blankCls="blank correct"}
  else if(status==="wrong"&&showAns){blankTxt=q.a[0];blankCls="blank wrong"}
  else if(status==="wrong"){blankTxt=inputVal||"\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0";blankCls="blank wrong"}

  let fb="";
  if(status==="correct") fb=`<div class="feedback correct">✓ Correct!</div>`;
  else if(status==="wrong"&&showAns) fb=`<div class="feedback wrong">Answer: <strong>${q.a[0]}</strong><br><span style="font-size:12px;opacity:.85">${q.n}</span></div>`;
  else if(status==="wrong") fb=`<div class="feedback wrong">Not quite. Try again, or tap "Show answer".</div>`;

  let sec="";
  if(status==="wrong"&&!showAns) sec+=`<button class="sbtn" onclick="doShowAns()">Show answer</button>`;
  if(status==="wrong") sec+=`<button class="sbtn" onclick="doNext()">Next →</button>`;

  document.getElementById("root").innerHTML=`
<div class="filters">
  ${["all","present","past","future"].map(f=>`<button class="fbtn${filter===f?" active":""}" onclick="setFilter('${f}')">${f==="all"?"All tenses":f==="present"?"Present":f==="past"?"Past":"Future"}</button>`).join("")}
</div>
<div class="scorebar">
  <div class="bar"><div class="barfill" style="width:${pct}%"></div></div>
  <span class="scoretxt">${correct}/${total} correct</span>
</div>
<div class="card">
  <div class="cardtop">
    <span class="badge badge-${q.t}">${tLabel[q.t]}</span>
    <span class="counter">${(idx%f.length)+1} / ${f.length}</span>
  </div>
  <div class="sentence">
    ${q.s[0]?`<span>${q.s[0]} </span>`:""}
    <span class="${blankCls}">${blankTxt}</span>
    ${q.s[1]?`<span> ${q.s[1]}</span>`:""}
  </div>
  <div class="hint">verb hint: (${q.h})</div>
  ${fb}
</div>
<div class="inputrow">
  <input id="di" type="text" placeholder="Type the verb form…" value="${inputVal.replace(/"/g,'&quot;')}" oninput="onInput(this.value)" onkeydown="onKey(event)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" ${status==="correct"?"disabled":""}/>
  <button class="chkbtn" onclick="doCheck()" ${(!inputVal.trim()||status==="correct")?"disabled":""}>Check</button>
</div>
<div class="secondrow">${sec}</div>`;
  const inp=document.getElementById("di");
  if(inp&&status!=="correct") inp.focus();
}

function setFilter(f){filter=f;idx=0;correct=0;total=0;status=null;showAns=false;inputVal="";deck=shuffle(Q);render()}
function onInput(v){inputVal=v;if(status==="wrong"){status=null;showAns=false}render()}
function onKey(e){if(e.key==="Enter"){if(status)doNext();else doCheck()}}
function doCheck(){
  if(!inputVal.trim()||status==="correct")return;
  const norm=inputVal.trim().toLowerCase().replace(/\s+/g," ");
  const q=cur();
  const ok=q.a.some(a=>a.toLowerCase()===norm);
  status=ok?"correct":"wrong";total++;if(ok)correct++;
  render();
  if(ok)setTimeout(doNext,1300);
}
function doNext(){idx++;status=null;showAns=false;inputVal="";render()}
function doShowAns(){showAns=true;render()}
render();
</script>
</body>
</html>
